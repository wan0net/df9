name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, wan0-ci, df9]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run audit
      - run: npm run verify:public
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:pages
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/6
    runs-on: [self-hosted, linux, x64, wan0-ci, df9]
    # Six shards keep each WebGL test job comfortably within its explicit
    # timeout while covering the full suite.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PLAYWRIGHT_OUTPUT_DIR: test-results/shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME="playwright-results-${SHARD}.json" npx playwright test --reporter=json --shard="${SHARD}/6"
          node scripts/assert-playwright-skips.mjs "playwright-results-${SHARD}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-results-${{ matrix.shard }}.json
            test-results/shard-${{ matrix.shard }}/
          if-no-files-found: ignore

  e2e:
    name: e2e
    if: always()
    needs: e2e-shard
    runs-on: [self-hosted, linux, x64, wan0-ci, df9]
    timeout-minutes: 2
    steps:
      - name: Require every E2E shard to pass
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: test "$SHARD_RESULT" = success
